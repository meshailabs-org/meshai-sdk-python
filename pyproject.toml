[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshai-sdk"
version = "0.6.0"
description = "MeshAI Python SDK — Agent Control Plane client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "MeshAI Labs", email = "hello@meshai.dev" }]
keywords = ["ai", "agents", "monitoring", "observability", "meshai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
crewai = ["crewai>=0.80.0"]
langchain = ["langchain-core>=0.3.0"]
autogen = ["autogen-core>=0.4.0"]
gemini = ["google-genai>=1.0.0"]
bedrock = ["boto3>=1.35.0"]
llamaindex = ["llama-index-core>=0.11.0"]
agno = ["agno>=1.0.0"]
pydantic-ai = ["pydantic-ai>=0.0.30"]
tracer = [
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "regex>=2024.4.16",
    "pyyaml>=6.0",
]
semantic-kernel = ["semantic-kernel>=1.0.0"]
dev = [
    "meshai-sdk[tracer]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    # Bounded on BOTH sides, and that is the point rather than an accident: CI
    # installs the newest match, so an open upper bound makes the lint gate
    # non-deterministic - a release we did not make can turn CI red on a branch
    # that changed nothing. The floor moves only when someone has actually done
    # the fixing pass for that version's new rules. The 0.16 pass (RUF100,
    # SIM117, ISC004, PYI036, PYI034, BLE001, S110, SIM102, UP035) is done, so
    # the window is now 0.16.x. Raising it to 0.17 means doing that work again,
    # deliberately, not discovering it in whatever PR runs first.
    "ruff>=0.16.1,<0.17",
]

[project.urls]
Homepage = "https://meshai.dev"
Documentation = "https://meshai.dev/docs/sdk"
Repository = "https://github.com/meshailabs-org/meshai-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/meshai"]

[tool.hatch.build.targets.sdist]
exclude = [
  "AGENTS.md",
  "CLAUDE.md",
  ".claude",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
